<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BatTV</title>
<style>
/* Layout: barra in alto (sezioni + ricerca), categorie a sinistra, griglia a destra; player a tutto schermo. Tema scuro unico, pensato per lo schermo della Tesla. */
:root{
  --bg:#0f1216; --panel:#171b21; --line:#262c35; --fg:#e8ecf1; --mute:#8b95a3;
  --accent:#4fb3ff; --accent-ink:#06121c; --bad:#ff6b6b; --star:#ffc94d;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* Accesso */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.box h1{margin:0;font-size:24px}
.box p{margin:0;color:var(--mute);font-size:14px}
label{display:grid;gap:6px;font-size:14px;color:var(--mute)}
input[type=text],input[type=password],input[type=url],input[type=search]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:1em}
.or{text-align:center;color:var(--mute);font-size:13px}

/* App */
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;gap:6px}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px}
.tab[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
header input{flex:1;min-width:160px}
main{display:grid;grid-template-columns:260px 1fr;min-height:0}
#cats{overflow:auto;border-right:1px solid var(--line);padding:8px}
.cat{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;color:var(--mute)}
.cat[aria-pressed=true]{background:var(--line);color:var(--fg)}
.cattool{display:block;width:100%;margin-top:8px;background:none;border:1px dashed var(--line);border-radius:8px;padding:11px 12px;color:var(--mute);text-align:left}
.crow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;padding:10px 4px;border-bottom:1px solid var(--line)}
.crow span{flex:1 1 100%;min-width:0;font-size:15px;overflow-wrap:break-word}
.crow .hide{margin-right:auto}
.crow button{flex:none;width:40px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.crow button:disabled{opacity:.3}
.edithead{display:flex;gap:6px;margin-bottom:6px}
.edithead button{flex:1;padding:10px}
#list{overflow:auto;padding:16px;min-width:0}
.status{color:var(--mute);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex}
.item:hover{border-color:var(--accent)}
.open{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:0;padding:0;text-align:left}
.poster{aspect-ratio:2/3;width:100%;background:var(--line) center/cover no-repeat}
.live .open{flex-direction:row;align-items:center;gap:10px;padding:8px}
.live .poster{aspect-ratio:1;width:48px;flex:none;border-radius:6px;background-size:contain;background-color:var(--bg)}
.open span{padding:7px 9px;font-size:13px;overflow-wrap:anywhere}
.live .open span{padding:0}
.fav{flex:none;background:none;border:0;padding:0 16px;font-size:24px;line-height:1;color:var(--mute)}
.fav[aria-pressed=true]{color:var(--star)}
.item{position:relative}
.grid:not(.live) .fav{position:absolute;top:5px;right:5px;width:36px;height:36px;padding:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
.grid:not(.live) .fav[aria-pressed=true]{color:var(--star)}
.sect{margin:20px 0 10px;font-size:18px}
.sect:first-child{margin-top:0}
.sect small{color:var(--mute);font-weight:400;font-size:14px}
.crow .hide{width:auto;padding:0 10px;font-size:13px}
.crow.off span{color:var(--mute);text-decoration:line-through}
.crow.off .hide{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--mute);max-width:40ch}
.more{margin:16px auto 0;display:block}

main.nocats{grid-template-columns:1fr;grid-template-rows:1fr}

/* Episodi */
#series{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:5}
#series h2{margin:8px 0 12px}
.seasons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.ep .mk{margin-left:auto;color:var(--accent);font-size:.9em;flex:none}
.ep.seen{color:var(--mute)}
.open .sub{display:block;color:var(--accent);font-size:.85em;margin-top:2px}
.btn.resume{display:block;width:100%;text-align:left;margin:0 0 12px}
.btn.resume small{font-weight:400;opacity:.8}

/* Player */
#player{position:fixed;inset:0;background:#000;z-index:10;display:grid;grid-template-rows:auto 1fr}
#player .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.6)}
#player .bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
video{width:100%;height:100%;min-height:0;background:#000}
#perr{position:absolute;left:16px;right:16px;bottom:24px;text-align:center;color:var(--bad)}
#player .bar .btn{padding:10px 14px}
/* Mini player: resta in un angolo mentre sfogli canali e categorie */
#player.mini{inset:auto;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#player.mini.left{right:auto;left:16px}
#player.mini .bar{padding:6px 8px;gap:6px}
#player.mini .bar b{font-size:13px}
#player.mini .bar .btn{padding:8px 10px;font-size:14px}
#player.mini #perr{bottom:8px;font-size:13px}
#player:not(.mini) #pside{display:none}
body.has-mini #list{padding-bottom:300px}

/* Telecomando: riquadro di selezione evidente anche da lontano */
.cat:focus-visible,.tab:focus-visible,.ep:focus-visible,.crow button:focus-visible,.cattool:focus-visible{outline:3px solid var(--accent);outline-offset:2px;color:var(--fg)}
.tab[aria-pressed=true]:focus-visible,.cat[aria-pressed=true]:focus-visible{color:var(--bg)}
body.tv .item:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.item:has(:focus-visible){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.item .open:focus-visible{outline:0}
.fav:focus-visible{outline:3px solid var(--star);outline-offset:-3px;border-radius:999px}
/* App Android TV: niente ponte, niente file M3U, player nativo */
body.native .webonly{display:none!important}
/* Vista TV compatta: testo e spaziature più piccoli per vedere più categorie e canali per schermata */
body.tv{font-size:13px}
body.tv header{padding:6px 12px;gap:8px}
body.tv .tab{padding:5px 12px}
body.tv header input,body.tv header .btn{padding:6px 10px}
body.tv main{grid-template-columns:190px 1fr}
/* Senza categorie (Preferiti) la lista prende tutta la larghezza: prima restava schiacciata in 190px */
body.tv main.nocats{grid-template-columns:1fr}
body.tv #cats{padding:6px}
body.tv .cat,body.tv .cattool{padding:5px 10px;border-radius:6px}
body.tv #list{padding:10px}
body.tv .status{margin-bottom:8px}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
body.tv .grid.live{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
body.tv .item{border-radius:8px}
body.tv .live .open{padding:4px 6px;gap:8px}
body.tv .live .poster{width:30px;border-radius:4px}
body.tv .open span{padding:5px 7px;font-size:12px}
body.tv .live .open span{padding:0}
body.tv .fav{padding:0 8px;font-size:17px;pointer-events:none}
/* Sulla TV la stella è solo un segno: compare quando l'elemento è nei preferiti */
body.tv .fav[aria-pressed=false]{visibility:hidden}
body.tv .grid:not(.live) .fav{width:30px;height:30px;top:4px;right:4px}
body.tv .sect{margin:12px 0 6px;font-size:15px}
body.tv .crow{padding:6px 2px}
body.tv .crow span{font-size:13px}
body.tv .crow button{width:32px;height:32px}
body.tv #series{padding:10px}
body.tv .ep{padding:7px 12px;margin-bottom:5px;border-radius:8px}
body.tv .box{padding:18px;gap:10px}
body.tv input[type=text],body.tv input[type=password],body.tv input[type=url]{padding:8px 10px}
body.tv .btn{padding:9px 14px}

/* Icone delle sezioni: si vedono solo nella barra in basso del telefono */
.tab .ti{display:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{-webkit-tap-highlight-color:transparent}
@media (hover:none){.item:hover{border-color:var(--line)}}

/* ---------- Telefono in verticale: sezioni in basso, categorie a scorrimento, griglie fitte ---------- */
@media (max-width:700px){
  :root{--nav:58px}
  #app{height:100%;height:100dvh}
  #login{padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
  .box{padding:20px 18px}
  header{flex-wrap:nowrap;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px))}
  header input{min-width:0;padding:9px 12px}
  header #out{flex:none;padding:9px 12px}
  /* Barra delle sezioni in fondo allo schermo, a portata di pollice */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;gap:0;background:var(--panel);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .tabs .tab{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:0;padding:0 2px;font-size:11px;color:var(--mute);background:none}
  .tabs .tab[aria-pressed=true]{background:none;color:var(--accent);border:0}
  .tabs .tab[aria-pressed=true] .ti{fill:currentColor;fill-opacity:.18}
  .tabs .tab .ti{display:block;width:24px;height:24px}
  .tabs .tab .tstar{display:none}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px))}
  main.nocats{grid-template-rows:1fr}
  /* Categorie come pastiglie che scorrono di lato */
  #cats{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;scrollbar-width:none}
  #cats::-webkit-scrollbar{display:none}
  .cat,.cattool{flex:none;white-space:nowrap;width:auto;margin-top:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px}
  .cat[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  #cats.editing{display:block;max-height:55vh;overflow-y:auto}
  #list{padding:12px}
  .status{margin-bottom:10px;font-size:14px}
  .sect{margin:16px 0 8px;font-size:16px}
  /* Film e serie: tre locandine per riga */
  .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
  .grid:not(.live) .open span{padding:5px 6px;font-size:11px}
  .grid:not(.live) .fav{width:26px;height:26px;top:3px;right:3px;font-size:15px}
  /* Canali: una riga per canale, più compatta */
  .grid.live{grid-template-columns:1fr;gap:6px}
  .live .open{padding:6px 8px}
  .live .poster{width:40px}
  .live .open span{font-size:14px}
  .fav{padding:0 14px}
  /* Serie: Indietro sempre in alto, stagioni che scorrono di lato */
  #series{padding:0 calc(12px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  #series>.row{position:sticky;top:0;z-index:1;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px}
  #series>.row .btn{padding:9px 14px}
  #series h2{margin:2px 0 10px;font-size:20px}
  .seasons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:0 12px}
  .seasons::-webkit-scrollbar{display:none}
  .seasons .tab{flex:none;white-space:nowrap;padding:8px 14px}
  .ep{padding:11px 12px;margin-bottom:6px}
  .btn.resume{padding:12px 14px}
  /* Player */
  #player .bar{gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
  #player .bar .btn{padding:8px 12px;font-size:14px}
  #player.mini{right:8px;left:auto;width:min(340px,calc(100vw - 16px));bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom,0px))}
  #player.mini .bar{padding:6px 8px}
  #player.mini #ptitle,#player.mini #pside{display:none}
  #player.mini .bar{justify-content:flex-end}
  body.has-mini #list{padding-bottom:240px}
}

/* ---------- Telefono in orizzontale: poco spazio in altezza, tutto più compatto ---------- */
@media (max-height:500px) and (min-width:701px){
  header{padding:6px calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px));gap:8px}
  .tab{padding:6px 14px}
  header input,header .btn{padding:7px 12px}
  main{grid-template-columns:190px 1fr}
  #cats{padding:6px 6px 6px calc(6px + env(safe-area-inset-left,0px))}
  .cat,.cattool{padding:7px 10px;font-size:14px}
  #list{padding:10px calc(10px + env(safe-area-inset-right,0px)) 10px 10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  main.nocats{grid-template-columns:1fr}
  .open span{padding:6px 8px;font-size:12px}
  .grid:not(.live) .fav{width:32px;height:32px;font-size:18px}
  .live .open{padding:5px 8px}
  .live .poster{width:36px}
  #series{padding:8px calc(12px + env(safe-area-inset-right,0px)) 12px calc(12px + env(safe-area-inset-left,0px))}
  .seasons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .seasons .tab{flex:none;white-space:nowrap}
  .ep{padding:9px 12px;margin-bottom:6px}
  #player .bar{padding:6px calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px))}
  #player .bar .btn{padding:7px 12px;font-size:14px}
  #player.mini{width:min(300px,45vw);bottom:8px;right:8px}
}

/* Prossimo episodio */
#nextup{position:fixed;z-index:20;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#nextup small,#nutime{color:var(--mute);font-size:13px}
.nbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0}
.nbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
#nextup .row .btn{padding:10px 14px}
body.tv #nextup{padding:10px 12px;width:300px}
@media (max-width:700px){
  #nextup{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>

<section id="login">
  <form class="box" id="lf" novalidate>
    <h1>BatTV</h1>
    <p>Inserisci i dati Xtream del tuo provider.</p>
    <label>Server <input id="srv" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://server.esempio:443"></label>
    <label>Indirizzo DNS del provider, per aggiornare il server da solo (facoltativo) <input id="dns" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://sito.esempio/dns.php"></label>
    <label>Username <input id="usr" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password <input id="pwd" type="password" autocomplete="current-password" required></label>
    <label class="webonly">Ponte https (se il server è in http) <input id="px" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://iptv-ponte.nome.workers.dev/?k=chiave"></label>
    <label class="row" style="color:var(--fg)"><input id="rem" type="checkbox" checked> Ricorda su questo dispositivo</label>
    <button class="btn" id="go">Connetti</button>
    <div class="err" id="lerr"></div>
    <div class="or webonly">oppure</div>
    <label class="btn ghost webonly" style="text-align:center;display:block">Carica un file M3U
      <input id="m3ufile" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,text/plain" hidden>
    </label>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="tabs">
      <button class="tab" data-t="fav"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg><span class="tstar">★ </span>Preferiti</button>
      <button class="tab" data-t="live"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg>Live</button>
      <button class="tab" data-t="vod"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7.5 4v16M16.5 4v16M3 12h4.5M16.5 12H21"/></svg>Film</button>
      <button class="tab" data-t="series"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M6 6h12M9 3h6"/></svg>Serie TV</button>
    </div>
    <input id="q" type="search" placeholder="Cerca…">
    <button class="btn ghost" id="out">Esci</button>
  </header>
  <main>
    <nav id="cats"></nav>
    <section id="list"></section>
  </main>
</div>

<section id="series" hidden></section>

<div id="nextup" hidden role="dialog" aria-live="polite"><small>Prossimo episodio</small><b id="nutitle"></b><span id="nutime"></span><div class="nbar"><i id="nubar"></i></div><div class="row"><button class="btn" id="nugo">Guarda ora</button><button class="btn ghost" id="nucancel">Annulla</button></div></div>

<section id="player" hidden>
  <div class="bar"><b id="ptitle"></b><button class="btn ghost" id="pside" aria-label="Sposta nell'altro angolo">⇆</button><button class="btn ghost" id="ppip" hidden>PiP</button><button class="btn ghost" id="pmini">Riduci</button><button class="btn ghost" id="pclose">Chiudi</button></div>
  <video id="vid" controls playsinline></video>
  <div id="perr"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const S={mode:null,base:'',u:'',p:'',dns:'',home:'',tab:'live',cat:'*',q:'',limit:120,items:{},cats:{}};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
/* Nell'app Android TV il ponte è dentro l'app stessa: niente Cloudflare, niente limiti http/https */
const NATIVE=!!window.BatTVNative,NATIVE_PX='https://appassets.androidplatform.net/proxy';
const bridge=()=>NATIVE?NATIVE_PX:S.px;
/* Passa sempre dal ponte, se c'è (serve per leggere il DNS, che non permette la lettura diretta) */
const PA=u=>{const b=bridge();return b?b+(b.includes('?')?'&':'?')+'url='+encodeURIComponent(u):u};
/* Passa dal ponte gli indirizzi http (bloccati da una pagina https); nell'app passa tutto */
const P=u=>NATIVE?(/^https?:/i.test(u||'')?PA(u):u):(S.px&&/^http:/i.test(u||'')?PA(u):u);
const mixed=b=>!NATIVE&&location.protocol==='https:'&&/^http:/i.test(b)&&!S.px;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Xtream ---------- */
async function api(action,extra='',noRetry,again){
  const url=()=>`${S.base}/player_api.php?username=${encodeURIComponent(S.u)}&password=${encodeURIComponent(S.p)}${action?'&action='+action:''}${extra}`;
  let r;
  try{r=await fetch(P(url()))}catch(e){
    /* Il server non risponde: forse il provider l'ha cambiato, chiedo quello nuovo al DNS e riprovo una volta */
    if(!noRetry&&await refreshBase())return api(action,extra,true);
    throw new Error(S.px&&!NATIVE?'Il ponte non risponde: controlla l\'indirizzo del ponte.':'Il server non risponde.');
  }
  if(r.status===403&&S.px&&!NATIVE)throw new Error('Il ponte rifiuta la chiave: controlla la parte ?k= nell\'indirizzo del ponte.');
  if(!r.ok){
    if(!noRetry&&r.status>=500&&await refreshBase())return api(action,extra,true);
    throw new Error('Il server ha risposto con errore '+r.status+'.');
  }
  /* Gli elenchi grandi (i film possono pesare oltre 10 MB) a volte arrivano troncati: in quel caso riprovo una volta */
  const txt=await r.text();
  try{return JSON.parse(txt)}catch(e){
    if(!again)return api(action,extra,noRetry,true);
    const err=new Error('Il provider ha mandato un elenco incompleto. Riprova tra poco: se capita spesso, avvisa Michele.');err.partial=true;throw err;
  }
}

/* ---------- Server che cambia: lo legge dall'indirizzo DNS del provider ---------- */
/* Pulisce un indirizzo scritto a mano: toglie spazi e caratteri invisibili (la tastiera della TV ne lascia),
   aggiunge http(s):// se manca. Restituisce '' se non sembra un indirizzo. */
function normUrl(s,scheme){
  s=String(s||'').replace(/[\s​-‍﻿]+/g,'');
  if(!s)return '';
  if(!/^https?:\/\//i.test(s))s=(scheme||'http')+'://'+s.replace(/^\/+/,'');
  s=s.replace(/\/+$/,'');
  return /^https?:\/\/[a-z0-9.-]+(:\d+)?(\/|$)/i.test(s)&&/[a-z0-9]\.[a-z0-9]|localhost|:\d/i.test(s.split('/')[2])?s:'';
}
async function dnsCandidates(){
  if(!S.dns)return [];
  let d;
  try{
    const r=await fetch(PA(S.dns),{cache:'no-store'});
    if(!r.ok)throw 0;
    d=await r.json();
  }catch(e){
    throw new Error(bridge()?'Non riesco a leggere l\'indirizzo DNS: controlla che sia giusto.':'Non riesco a leggere l\'indirizzo DNS: il sito non permette la lettura diretta, inserisci l\'indirizzo del ponte.');
  }
  const out=[];
  for(const s of (d&&d.servers)||[]){
    const h=normUrl(s&&typeof s==='object'?s.dns||s.url:s,'http');
    if(!h)continue;
    /* Spesso il server risponde anche in https: lo provo prima, così non serve il ponte */
    if(/^http:/i.test(h))out.push(h.replace(/^http:/i,'https:'));
    out.push(h);
  }
  if(!out.length)throw new Error('Il DNS del provider non ha indicato nessun server: riprova tra qualche minuto.');
  return [...new Set(out)];
}
async function tryBase(b){
  S.base=b.replace(/\/+$/,'');
  if(mixed(S.base))throw new Error('Il server del provider usa http e questa pagina è in https: inserisci l\'indirizzo del ponte.');
  const info=await api('','',true);
  if(!info||!info.user_info||String(info.user_info.auth)!=='1')throw new Error('Username o password non validi.');
}
function saveBase(){
  const x=store.get('xt');
  if(x&&(x.base!==S.base||x.home!==S.home)){x.base=S.base;x.home=S.home;store.set('xt',x)}
  $('#srv').value=S.base;
}
let refreshing=null;
function refreshBase(){
  if(S.mode!=='x'||!S.dns)return Promise.resolve(false);
  if(!refreshing)refreshing=(async()=>{
    const old=S.base;
    let list;try{list=await dnsCandidates()}catch(e){return false}
    for(const b of list){
      if(b===old)continue;
      try{await tryBase(b);saveBase();return true}catch(e){}
    }
    S.base=old;return false;
  })().finally(()=>{refreshing=null});
  return refreshing;
}
async function loginXtream(base,u,p,px,dns,home){
  S.mode='x';S.u=u;S.p=p;S.px=normUrl(px,'https');S.dns=normUrl(dns,'https');
  const b0=normUrl(base,'http');
  if((dns||'').trim()&&!S.dns)throw new Error('L\'indirizzo DNS non sembra giusto: controlla che sia scritto come nella guida.');
  /* Server scritto male ma DNS presente: il server lo prendo dal DNS e quello scritto lo ignoro */
  if((base||'').trim()&&!b0&&!S.dns)throw new Error('Il server non sembra un indirizzo valido.');
  const list=[];let last=null;
  if(S.dns){try{list.push(...await dnsCandidates())}catch(e){last=e}}
  if(b0)list.push(b0);
  const todo=[...new Set(list)];
  if(!todo.length)throw last||new Error('Inserisci il server oppure l\'indirizzo DNS del provider.');
  for(const b of todo){
    try{
      await tryBase(b);
      /* "home" resta fisso anche se il server cambia, così preferiti e ordine delle categorie non si perdono */
      S.home=home||S.base;return;
    }catch(e){last=e}
  }
  throw last;
}
async function loadTab(t){
  if(S.items[t])return;
  const map={live:['get_live_categories','get_live_streams'],vod:['get_vod_categories','get_vod_streams'],series:['get_series_categories','get_series']}[t];
  const cats=await api(map[0]);
  /* Elenco completo in un colpo solo; se il provider lo interrompe (cataloghi molto grandi) lo chiedo una categoria
     alla volta, e me lo ricordo per le prossime aperture così non perdo tempo con l'elenco completo */
  const key='split:'+acct()+':'+t;let list;
  if(!store.get(key)){
    try{list=await api(map[1])}catch(e){if(!e.partial)throw e;store.set(key,1)}
  }
  if(!list)list=await byCategory(map[1],cats||[]);
  S.cats[t]=(cats||[]).map(c=>({id:String(c.category_id),name:c.category_name}));
  S.items[t]=(list||[]).map(x=>({
    id:x.stream_id??x.series_id, name:x.name||'', logo:x.stream_icon||x.cover||'',
    cat:String(x.category_id), ext:x.container_extension||'', type:t
  }));
}
async function byCategory(action,cats){
  const ids=cats.map(c=>String(c.category_id)),out=[];let done=0,fail=0,i=0;
  const say=()=>{const st=$('#list .status');if(st)st.textContent=`Caricamento… ${done} di ${ids.length} categorie`};
  say();
  const worker=async()=>{
    while(i<ids.length){
      const id=ids[i++];
      try{const r=await api(action,'&category_id='+encodeURIComponent(id));if(Array.isArray(r))out.push(...r.map(x=>x&&x.category_id==null?{...x,category_id:id}:x))}catch(e){fail++}
      done++;say();
    }
  };
  await Promise.all(Array.from({length:Math.min(5,ids.length)},worker));
  if(ids.length&&fail===ids.length)throw new Error('Il provider non riesce a mandare l\'elenco. Riprova tra poco: se capita spesso, avvisa Michele.');
  return out;
}
function xUrl(t,it){
  const a=`${S.base}/${t}/${encodeURIComponent(S.u)}/${encodeURIComponent(S.p)}/`;
  if(t==='live')return a+it.id+'.m3u8';
  return a+it.id+'.'+(it.ext||'mp4');
}

/* ---------- M3U ---------- */
function parseM3U(txt){
  const out={live:[],vod:[],series:[]};let cur=null;
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const at={};l.replace(/([\w-]+)="([^"]*)"/g,(_,k,v)=>{at[k.toLowerCase()]=v});
      cur={name:(l.slice(l.lastIndexOf(',')+1)||at['tvg-name']||'').trim(),logo:at['tvg-logo']||'',cat:at['group-title']||'Senza categoria'};
    }else if(!l.startsWith('#')&&cur){
      cur.url=l;
      const t=/\/movie\//i.test(l)?'vod':/\/series\//i.test(l)?'series':'live';
      cur.type=t;out[t].push(cur);cur=null;
    }
  }
  S.mode='m';
  for(const t in out){
    S.items[t]=out[t];
    S.cats[t]=[...new Set(out[t].map(i=>i.cat))].map(c=>({id:c,name:c}));
    out[t].forEach(i=>i.cat=i.cat);
  }
}

/* ---------- Categorie: ordine e nascoste (per sezione, salvate su questo dispositivo) ---------- */
const ordKey=t=>'order:'+acct()+':'+t;
const hidKey=t=>'hidden:'+acct()+':'+t;
const getHidden=t=>new Set(store.get(hidKey(t))||[]);
function toggleHidden(id){
  const h=getHidden(S.tab);h.has(id)?h.delete(id):h.add(id);
  store.set(hidKey(S.tab),[...h]);
  if(h.has(S.cat))S.cat='*';
}
function sortedCats(t){
  const o=store.get(ordKey(t))||[],pos=new Map(o.map((id,i)=>[id,i]));
  const p=c=>pos.has(c.id)?pos.get(c.id):1e9;
  return (S.cats[t]||[]).map((c,i)=>({c,i})).sort((a,b)=>p(a.c)-p(b.c)||a.i-b.i).map(x=>x.c);
}
function moveCat(id,dir){
  const ids=sortedCats(S.tab).map(c=>c.id),i=ids.indexOf(id);if(i<0)return;
  ids.splice(i,1);
  ids.splice(dir==='top'?0:Math.max(0,Math.min(ids.length,i+(dir==='up'?-1:1))),0,id);
  store.set(ordKey(S.tab),ids);renderCats();
  const r=$('#cats').querySelector(`[data-row="${CSS.escape(id)}"]`);if(r&&dir!=='top')r.scrollIntoView({block:'nearest'});
}
function renderCats(){
  const all=sortedCats(S.tab),hid=getHidden(S.tab),el=$('#cats');
  el.classList.toggle('editing',!!S.editCats);
  if(S.editCats){
    const nh=all.filter(c=>hid.has(c.id)).length;

      <p class="status">${nh?nh+' nascoste · ':''}tocca Nascondi per togliere una categoria</p>`+
      all.map((c,i)=>{const h=hid.has(c.id);return `<div class="crow${h?' off':''}" data-row="${esc(c.id)}"><span>${esc(c.name)}</span>
        <button class="hide" data-hide="${esc(c.id)}" aria-pressed="${h}">${h?'Mostra':'Nascondi'}</button>
        <button data-mv="top" data-id="${esc(c.id)}" aria-label="Sposta in cima" ${i?'':'disabled'}>⤒</button>
        <button data-mv="up" data-id="${esc(c.id)}" aria-label="Sposta su" ${i?'':'disabled'}>↑</button>
        <button data-mv="down" data-id="${esc(c.id)}" aria-label="Sposta giù" ${i<all.length-1?'':'disabled'}>↓</button></div>`}).join('');
    return;
  }
  const cs=all.filter(c=>!hid.has(c.id));
  el.innerHTML=[{id:'*',name:'Tutte'},...cs].map(c=>`<button class="cat" data-c="${esc(c.id)}" aria-pressed="${c.id===S.cat}">${esc(c.name)}</button>`).join('')+
    (all.length>1?'<button class="cattool" data-act="edit">↕ Riordina e nascondi</button>':'');
}
function filtered(){
  const q=S.q.toLowerCase(),hid=S.tab==='fav'?new Set():getHidden(S.tab);
  return (S.items[S.tab]||[]).filter(i=>!hid.has(i.cat)&&(S.cat==='*'||i.cat===S.cat)&&(!q||i.name.toLowerCase().includes(q)));
}
function card(i,n,live,favs){
  const on=favs.has(favKey(i));
  return `<div class="item"><button class="open" data-n="${n}"><div class="poster" ${i.logo?`style="background-image:url('${esc(P(i.logo)).replace(/'/g,'%27')}')"`:''}></div><span>${esc(i.name)}${i.sub?`<small class="sub">${esc(i.sub)}</small>`:''}</span></button><button class="fav" data-f="${n}" aria-pressed="${on}" aria-label="${on?'Togli dai':'Aggiungi ai'} preferiti">${on?'★':'☆'}</button></div>`;
}
function renderList(){
  const favs=new Set(getFavs().map(favKey)),L=$('#list');
  /* "Continua a guardare": le serie lasciate a metà, in cima a Preferiti e Serie TV */
  const cont=S.mode==='x'&&!S.q&&(S.tab==='fav'||(S.tab==='series'&&S.cat==='*'))?continueList():[];
  const contHtml=(items)=>cont.length?`<h3 class="sect">Continua a guardare <small>${cont.length}</small></h3><div class="grid">${cont.map(i=>{items.push(i);return card(i,items.length-1,false,favs)}).join('')}</div>`:'';
  L._off=0;
  if(S.tab==='fav'){
    if(!(S.items.fav||[]).length&&!cont.length){
      L.innerHTML=`<p class="empty">Nessun preferito. ${document.body.classList.contains('tv')?'Tieni premuto OK':'Tocca la stella ☆'} su un canale, un film o una serie per aggiungerlo qui.</p>`;
      L._items=[];return;
    }
    const all=filtered(),items=[];let html=contHtml(items);
    for(const [t,label] of [['live','Canali'],['vod','Film'],['series','Serie TV']]){
      const g=all.filter(i=>typeOf(i)===t);if(!g.length)continue;
      html+=`<h3 class="sect">${label} <small>${g.length}</small></h3><div class="grid ${t==='live'?'live':''}">${g.map(i=>{items.push(i);return card(i,items.length-1,t==='live',favs)}).join('')}</div>`;
    }
    L.innerHTML=html||'<p class="status">Nessun risultato</p>';L._items=items;return;
  }
  const all=filtered(),shown=all.slice(0,S.limit),live=S.tab==='live';
  const label={live:'canali',vod:'film',series:'serie'}[S.tab];
  const items=[],top=contHtml(items),off=items.length;
  L.innerHTML=`${top}${top?`<h3 class="sect">Tutte le serie <small>${all.length}</small></h3>`:`<p class="status">${all.length} ${label}</p>`}
  <div class="grid ${live?'live':''}">${shown.map((i,n)=>card(i,n+off,live,favs)).join('')}</div>
  ${all.length>S.limit?'<button class="btn ghost more" id="more">Mostra altri</button>':''}`;
  L._items=items.concat(shown);L._off=off;
}

/* ---------- Tasto/gesto Indietro del telefono: chiude player e serie invece di uscire dal sito ----------
   Ogni schermata aperta sopra la lista aggiunge un passo alla cronologia; chiudendola dai pulsanti il passo viene tolto. */
const H={d:0,skip:0,pop:false};
function pushLayer(){if(NATIVE)return;try{history.pushState({battv:1},'');H.d++}catch(e){}}
function dropLayer(){if(NATIVE||!H.d)return;H.d--;if(H.pop)return;H.skip++;history.back()}
addEventListener('popstate',()=>{
  if(H.skip){H.skip--;return}
  if(!H.d)return;
  H.pop=true;
  try{if(!closeTop())H.d--}finally{H.pop=false}
});

/* ---------- Serie: ricorda episodio e punto di arrivo (salvati su questo dispositivo) ---------- */
const progKey=()=>'prog:'+acct();
const getProg=()=>store.get(progKey())||{};
const fmtT=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
function nextEp(eps,seasons,s,id){
  const L=eps[s]||[],i=L.findIndex(e=>String(e.id)===String(id));
  if(i>=0&&i+1<L.length)return{s,e:L[i+1]};
  for(let k=seasons.indexOf(s)+1;k>0&&k<seasons.length;k++)if((eps[seasons[k]]||[]).length)return{s:seasons[k],e:eps[seasons[k]][0]};
  return null;
}
/* Da dove ripartire: l'episodio lasciato a metà, oppure il successivo a quello finito */
function resumeTarget(sid,eps,seasons){
  const p=getProg()[sid],L=p&&p.last;if(!L)return null;
  if(!L.done){const e=(eps[L.s]||[]).find(x=>String(x.id)===String(L.epId));if(e)return{s:L.s,e,pos:L.pos||0,next:false}}
  const n=nextEp(eps,seasons,L.s,L.epId);return n?{...n,pos:0,next:true}:null;
}
/* Salva a che punto sei; un episodio conta come visto quando mancano meno di 2 minuti (titoli di coda) o hai superato il 92% */
function saveProg(m,pos,dur){
  if(!m||!(dur>0)||!(pos>=0))return;
  const all=getProg(),p=all[m.sid]||{w:{}};p.w=p.w||{};
  const done=pos>=dur*0.92||dur-pos<120;
  if(done)p.w[m.epId]=1;
  p.info=m.info;
  p.last={s:m.s,epId:m.epId,num:m.num,pos:done?0:Math.floor(pos),dur:Math.floor(dur),done,t:Date.now()};
  p.fin=done&&!m.hasNext;
  all[m.sid]=p;store.set(progKey(),all);
}
/* Serie da continuare, dalla più recente */
function continueList(){
  return Object.values(getProg()).filter(p=>p.info&&p.last&&!p.fin).sort((a,b)=>b.last.t-a.last.t).map(p=>({...p.info,type:'series',cat:'*',
    sub:`S${p.last.s}E${p.last.num}${p.last.done?' ✓':p.last.pos>5?' · '+fmtT(p.last.pos):''}`}));
}

async function openSeries(it){
  S.lastFocus=document.activeElement;
  if($('#series').hidden)pushLayer();
  const box=$('#series');box.hidden=false;box.innerHTML='<p class="status">Caricamento episodi…</p>';
  it={...it,type:'series'};
  try{
    const d=await api('get_series_info','&series_id='+it.id);
    const eps=d.episodes||{};const seasons=Object.keys(eps).sort((a,b)=>a-b);
    if(!seasons.length)throw new Error('Nessun episodio disponibile.');
    const info={id:it.id,name:it.name,logo:it.logo};
    const epUrl=e=>`${S.base}/series/${encodeURIComponent(S.u)}/${encodeURIComponent(S.p)}/${e.id}.${e.container_extension||'mp4'}`;
    /* next: l'episodio dopo questo, per farlo partire da solo a fine visione */
    const playEp=(s,e,start)=>play(`${it.name} · S${s}E${e.episode_num}`,epUrl(e),false,
      {sid:it.id,s,epId:e.id,num:e.episode_num,info,hasNext:!!nextEp(eps,seasons,s,e.id),
       next:()=>{const n=nextEp(eps,seasons,s,e.id);return n&&{label:`S${n.s}E${n.e.episode_num} · ${n.e.title||'Episodio'}`,play:()=>playEp(n.s,n.e,0)}}},start||0);
    let cur;
    const draw=s=>{
      cur=s;
      const p=getProg()[it.id]||{},w=p.w||{},L=p.last,r=resumeTarget(it.id,eps,seasons);
      const rlabel=r&&`${r.next?'▶ Prossimo':'▶ Riprendi'} S${esc(r.s)}E${esc(r.e.episode_num)} · ${esc(r.e.title||'Episodio')}${r.pos>5?` <small>da ${fmtT(r.pos)}</small>`:''}`;
      box.innerHTML=`<div class="row"><button class="btn ghost" id="sback">Indietro</button></div>
      <h2>${esc(it.name)}</h2>
      ${r?`<button class="btn resume" id="sresume">${rlabel}</button>`:(L?'<p class="status">Hai visto tutti gli episodi ✓</p>':'')}
      <div class="seasons">${seasons.map(x=>`<button class="tab" data-s="${x}" aria-pressed="${x===s}">Stagione ${esc(x)}</button>`).join('')}</div>
      ${eps[s].map((e,n)=>{
        const half=L&&!L.done&&String(L.epId)===String(e.id)&&L.pos>5;
        const mark=w[e.id]?'<span class="mk">✓</span>':half?`<span class="mk">${fmtT(L.pos)}</span>`:'';
        return `<button class="ep${w[e.id]?' seen':''}" data-e="${n}">${esc(e.episode_num)}. ${esc(e.title||'Episodio')}${mark}</button>`}).join('')}`;
      box.onclick=ev=>{
        const b=ev.target.closest('button');if(!b)return;
        if(b.id==='sback'){battvBack();return}
        if(b.id==='sresume'){const t=resumeTarget(it.id,eps,seasons);if(t)playEp(t.s,t.e,t.pos);return}
        if(b.dataset.s){draw(b.dataset.s);focusEl(box.querySelector(`[data-s="${CSS.escape(b.dataset.s)}"]`));return}
        if(b.dataset.e){
          /* L'episodio lasciato a metà riparte da dove eri, gli altri dall'inizio */
          const e=eps[cur][b.dataset.e],q=getProg()[it.id],L2=q&&q.last;
          playEp(cur,e,L2&&!L2.done&&String(L2.epId)===String(e.id)?L2.pos:0);
        }
      };
    };
    /* Dopo la visione ridisegna (✓ e Riprendi aggiornati) e rimette il riquadro su Riprendi */
    S.seriesView={type:'series',id:it.id,sid:it.id,redraw(){const r=resumeTarget(it.id,eps,seasons);draw(r?r.s:cur);focusEl($('#sresume')||box.querySelector('.ep'))}};
    const r=resumeTarget(it.id,eps,seasons);
    draw(r?r.s:seasons[0]);focusEl($('#sresume')||box.querySelector('.ep'));
  }catch(e){box.innerHTML=`<button class="btn ghost" onclick="battvBack()">Indietro</button><p class="status" style="color:var(--bad)">${esc(e.message)}</p>`;focusEl(box.querySelector('button'))}
}

/* ---------- Episodio successivo: a fine episodio conto alla rovescia, poi parte da solo ---------- */
const NEXT_SECS=10;
function hideNextUp(){if(S.nextUp){clearInterval(S.nextUp.timer);S.nextUp=null}$('#nextup').hidden=true}
function showNextUp(n,onCancel){
  hideNextUp();
  $('#nutitle').textContent=n.label;$('#nextup').hidden=false;
  const t0=Date.now();
  const go=()=>{const keep=S.lastFocus;hideNextUp();n.play();S.lastFocus=keep};
  const tick=()=>{
    const el=(Date.now()-t0)/1000;
    $('#nutime').textContent=`Parte tra ${Math.max(0,Math.ceil(NEXT_SECS-el))} s`;
    $('#nubar').style.width=Math.min(100,el/NEXT_SECS*100)+'%';
    if(el>=NEXT_SECS)go();
  };
  S.nextUp={timer:setInterval(tick,250),go,cancel(){hideNextUp();if(onCancel)onCancel()}};
  tick();focusEl($('#nugo'));
}
/* Finita una visione: se la serie è aperta la aggiorna, altrimenti aggiorna la lista (Continua a guardare) */
function afterPlay(){
  if(!$('#series').hidden&&S.seriesView){S.seriesView.redraw();return true}
  if(!$('#app').hidden&&(S.tab==='fav'||S.tab==='series')&&S.playing&&S.playing.meta){
    if(S.tab==='fav')S.items.fav=getFavs();renderList();
  }
  return false;
}

let hls=null;
let playId=0;
/* meta: dati dell'episodio, per ricordare il punto di arrivo; start: secondi da cui partire */
function play(title,raw,retried,meta,start){
  if(!retried||!S.lastFocus||!document.contains(S.lastFocus))S.lastFocus=document.activeElement;
  if(!retried)S.playing={title,raw,meta:meta||null};
  start=start||0;
  /* Nell'app il video va al player nativo, che legge anche MKV e audio AC3 */
  if(NATIVE){S.lastPlay={title,raw,retried:!!retried};BatTVNative.play(raw,title,Math.floor(start*1000));return}
  if($('#player').hidden)pushLayer();
  const v=$('#vid'),id=++playId;$('#perr').textContent='';$('#ptitle').textContent=title;$('#player').hidden=false;
  if(hls){hls.destroy();hls=null}
  const url=P(raw);let failed=false;
  const fail=async()=>{
    if(failed||id!==playId)return;failed=true;
    /* Se il provider ha cambiato server, riprendo lo stesso contenuto da quello nuovo */
    const old=S.base,at=v.currentTime||start;
    if(!retried&&S.mode==='x'&&S.dns&&raw.startsWith(old+'/')){
      $('#perr').textContent='Cerco il server aggiornato…';
      if(await refreshBase()&&id===playId)return play(title,S.base+raw.slice(old.length),true,null,at);
      if(id!==playId)return;
    }
    $('#perr').textContent=/\.mkv(\?|$)/i.test(url)?'Formato MKV: il browser spesso non lo riproduce.':'Impossibile riprodurre questo contenuto.';
  };
  v.onerror=fail;
  /* Riparte dal punto salvato e lo aggiorna ogni 15 secondi e alla fine */
  const m=S.playing&&S.playing.meta;let saved=0;
  v.onloadedmetadata=()=>{if(start>0&&id===playId&&!(v.duration>0&&start>=v.duration-5))v.currentTime=start};
  v.ontimeupdate=()=>{if(m&&id===playId&&Date.now()-saved>15000&&v.currentTime>0){saved=Date.now();saveProg(m,v.currentTime,v.duration)}};
  v.onended=()=>{
    if(!m||id!==playId)return;
    saveProg(m,v.duration,v.duration);
    const n=m.next&&m.next();
    /* Annulla chiude il player e torna alla serie */
    if(n)showNextUp(n,()=>{stop();if(!afterPlay())backTo(S.lastFocus)});
  };
  if(/\.m3u8(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
    hls=new Hls(start>0?{startPosition:start}:{});hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail()});
  }else v.src=url;
  v.play().catch(()=>{});
}
function setMini(on){
  $('#player').classList.toggle('mini',on);document.body.classList.toggle('has-mini',on);
  $('#pmini').textContent=on?'Ingrandisci':'Riduci';
}
function stop(){
  hideNextUp();
  const v=$('#vid'),m=S.playing&&S.playing.meta;
  if(!$('#player').hidden)dropLayer();
  if(m&&v.currentTime>0&&v.duration>0)saveProg(m,v.currentTime,v.duration);
  if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{});
  playId++;v.onerror=v.ontimeupdate=v.onended=v.onloadedmetadata=null;v.pause();if(hls){hls.destroy();hls=null}v.removeAttribute('src');v.load();
  $('#player').hidden=true;setMini(false);
}

/* ---------- Eventi ---------- */
function enterApp(){$('#login').hidden=true;$('#app').hidden=false;
  const avail=['live','vod','series'].filter(t=>S.mode==='x'||(S.items[t]||[]).length);
  document.querySelectorAll('.tab[data-t]').forEach(b=>b.hidden=b.dataset.t!=='fav'&&!avail.includes(b.dataset.t));
  show(getFavs().length?'fav':(avail[0]||'live')).then(()=>focusEl($('.tab[aria-pressed=true]')));
}
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();$('#lerr').textContent='';$('#go').disabled=true;$('#go').textContent='Connessione…';
  const base=$('#srv').value.trim(),u=$('#usr').value.trim(),p=$('#pwd').value,px=$('#px').value.trim(),dns=$('#dns').value.trim();
  const prev=store.get('xt');
  /* Stesso account di prima: tengo la stessa chiave per preferiti e categorie */
  const home=prev&&prev.u===u?prev.home||prev.base:'';
  try{
    if(!u||!p)throw new Error('Inserisci username e password.');
    await loginXtream(base,u,p,px,dns,home);
    $('#srv').value=S.base;$('#dns').value=S.dns;
    if($('#rem').checked)store.set('xt',{base:S.base,u,p,px:S.px,dns:S.dns,home:S.home});else store.del('xt');
    enterApp();
  }catch(err){$('#lerr').textContent=err.message}
  $('#go').disabled=false;$('#go').textContent='Connetti';
});
$('#m3ufile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  S.px=$('#px').value.trim();
  const r=new FileReader();r.onload=()=>{parseM3U(r.result);enterApp()};r.readAsText(f);
});
document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));$('#cats').onclick=e=>{
  const a=e.target.closest('[data-act],[data-mv],[data-hide]');
  /* Le liste vengono ridisegnate: rimetto il riquadro del telecomando sul pulsante appena usato */
  const C=s=>$('#cats').querySelector(s);
  if(a){
    if(a.dataset.mv){const id=a.dataset.id,mv=a.dataset.mv;moveCat(id,mv);const n=C(`[data-mv="${mv}"][data-id="${CSS.escape(id)}"]`);focusEl(n&&!n.disabled?n:C(`[data-hide="${CSS.escape(id)}"]`));return}
    if(a.dataset.hide!==undefined){const id=a.dataset.hide,y=$('#cats').scrollTop;toggleHidden(id);renderCats();$('#cats').scrollTop=y;renderList();focusEl(C(`[data-hide="${CSS.escape(id)}"]`));return}
    if(a.dataset.act==='edit')S.editCats=true;
    if(a.dataset.act==='done')S.editCats=false;
    if(a.dataset.act==='reset'){store.del(ordKey(S.tab));store.del(hidKey(S.tab))}
    renderCats();renderList();$('#cats').scrollTop=0;
    focusEl(C(S.editCats?`[data-act="${a.dataset.act==='reset'?'reset':'done'}"]`:'.cat[aria-pressed=true]'));return;
  }
  const b=e.target.closest('.cat');if(!b)return;S.cat=b.dataset.c;S.limit=120;renderCats();renderList();$('#list').scrollTop=0;
  focusEl(C(`.cat[data-c="${CSS.escape(S.cat)}"]`))};
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;S.limit=120;renderList()},200)};
$('#list').onclick=e=>{
  if(e.target.id==='more'){const n=S.limit;S.limit+=120;renderList();focusEl($('#list').querySelector(`.open[data-n="${n+($('#list')._off||0)}"]`));return}
  const fb=e.target.closest('.fav');
  if(fb){
    const it=$('#list')._items[fb.dataset.f];toggleFav(it);
    if(S.tab==='fav'){const n=+fb.dataset.f;S.items.fav=getFavs();renderList();const fs=$('#list').querySelectorAll(document.body.classList.contains('tv')?'.open':'.fav');focusEl(fs[Math.min(n,fs.length-1)]||$('.tab[data-t=fav]'));return}
    const on=isFav(it);fb.setAttribute('aria-pressed',on);fb.textContent=on?'★':'☆';
    fb.setAttribute('aria-label',(on?'Togli dai':'Aggiungi ai')+' preferiti');return;
  }
  const b=e.target.closest('.open');if(!b)return;const it=$('#list')._items[b.dataset.n];
  if(it.url)return play(it.name,it.url);
  const t=typeOf(it);
  if(t==='series')return openSeries(it);
  play(it.name,xUrl(t==='vod'?'movie':'live',it));
};
$('#nugo').onclick=()=>S.nextUp&&S.nextUp.go();
$('#nucancel').onclick=()=>S.nextUp&&S.nextUp.cancel();
$('#pclose').onclick=()=>{stop();afterPlay()};
$('#pmini').onclick=()=>setMini(!$('#player').classList.contains('mini'));
$('#pside').onclick=()=>$('#player').classList.toggle('left');
/* Picture in Picture del browser, solo dove è supportato */
if(document.pictureInPictureEnabled)$('#ppip').hidden=false;
$('#ppip').onclick=async()=>{
  try{
    if(document.pictureInPictureElement)await document.exitPictureInPicture();
    else await $('#vid').requestPictureInPicture();
  }catch(e){$('#perr').textContent='Il Picture in Picture non è disponibile qui: usa Riduci.'}
};
$('#vid').addEventListener('enterpictureinpicture',()=>setMini(true));
$('#out').onclick=()=>{store.del('xt');S.items={};S.cats={};$('#app').hidden=true;$('#login').hidden=false;focusEl($('#srv'))};

/* ---------- Telecomando: frecce per spostarsi, OK per scegliere, Indietro per tornare ---------- */
function focusables(){
  const pl=$('#player'),root=!$('#nextup').hidden?$('#nextup'):!pl.hidden&&!pl.classList.contains('mini')?pl:!$('#series').hidden?$('#series'):!$('#login').hidden?$('#login'):document.body;
  /* Sulla TV la stella non si raggiunge: i preferiti si fanno tenendo premuto OK */
  const tv=document.body.classList.contains('tv');
  return [...root.querySelectorAll('button,input:not([type=file]),video[controls]')].filter(e=>!e.disabled&&e.offsetParent!==null&&!e.closest('[hidden]')&&!(tv&&e.classList.contains('fav')));
}
/* TV: OK breve apre, OK tenuto premuto aggiunge o toglie dai preferiti */
let hold=null;
function holdFav(b){
  const fb=b.parentNode.querySelector('.fav');if(!fb)return;
  const it=$('#list')._items[b.dataset.n];fb.click();
  const on=isFav(it),msg=on?'Aggiunto ai preferiti':'Tolto dai preferiti';
  if(NATIVE)BatTVNative.toast(msg);
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!document.body.classList.contains('tv'))return;
  const b=document.activeElement;
  if(!b||!b.classList.contains('open')||!$('#list').contains(b))return;
  e.preventDefault();e.stopImmediatePropagation();
  if(hold)return; /* il tasto tenuto giù ripete l'evento: lo ignoro */
  hold={b,done:false,t:setTimeout(()=>{if(hold){hold.done=true;holdFav(hold.b)}},600)};
},true);
document.addEventListener('keyup',e=>{
  if(e.key!=='Enter'||!hold)return;
  e.preventDefault();
  const h=hold;hold=null;clearTimeout(h.t);
  if(!h.done&&document.contains(h.b))h.b.click();
},true);
function focusEl(e){if(!e)return false;e.focus({preventScroll:true});e.scrollIntoView({block:'nearest',inline:'nearest'});return true}
function moveFocus(dir){
  const els=focusables(),cur=document.activeElement;
  if(!els.length)return false;
  if(!els.includes(cur))return focusEl(els.find(e=>$('#list').contains(e))||els[0]);
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  /* Cerca prima dentro un cono di 45° nella direzione premuta, poi ovunque in quella direzione; vince il più vicino e allineato */
  let best=null,bs=Infinity,any=null,as=Infinity;
  /* Destra e sinistra non salgono sulla barra delle sezioni: quella si raggiunge con su */
  const hdr=$('header'),side2=(dir==='left'||dir==='right')&&!hdr.contains(cur);
  for(const e of els){
    if(e===cur||(side2&&hdr.contains(e)))continue;
    const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
    const main={right:dx,left:-dx,down:dy,up:-dy}[dir],side=dir==='left'||dir==='right'?Math.abs(dy):Math.abs(dx);
    if(main<4)continue;
    const s=main+side*2;
    if(side<=main&&s<bs){bs=s;best=e}
    if(s<as){as=s;any=e}
  }
  return focusEl(best||any);
}
function backTo(e){if(e&&document.contains(e)&&e.offsetParent!==null)focusEl(e);else moveFocus('down')}
/* Indietro: chiude quello che è aperto, poi risale lista → categorie → sezioni. Restituisce false se non c'è più niente da chiudere. */
function closeSeries(){
  $('#series').hidden=true;dropLayer();
  const v=S.seriesView;S.seriesView=null;
  /* Aggiorna la lista (Continua a guardare, stelle cambiate nella scheda) e rimette il riquadro sullo stesso titolo */
  if(v&&v.type==='series'&&!$('#app').hidden&&(S.tab==='fav'||S.tab==='series')){
    if(S.tab==='fav')S.items.fav=getFavs();
    renderList();
    const n=($('#list')._items||[]).findIndex(i=>typeOf(i)===v.type&&String(i.id)===String(v.id));
    if(n>=0){focusEl($('#list').querySelector(`.open[data-n="${n}"]`));return}
  }
  backTo(S.lastFocus);
}
/* Chiude quello che è aperto sopra la lista: prima il player, poi la serie */
function closeTop(){
  if(S.nextUp){S.nextUp.cancel();return true}
  if(!$('#player').hidden){stop();if(!afterPlay())backTo(S.lastFocus);return true}
  if(!$('#series').hidden){closeSeries();return true}
  return false;
}
window.battvBack=function(){
  if(closeTop())return true;
  if(S.editCats){S.editCats=false;renderCats();renderList();focusEl($('#cats .cat[aria-pressed=true]'));return true}
  if(!$('#app').hidden){
    const t=document.activeElement;
    if(t&&$('#list').contains(t)&&!$('#cats').hidden)return focusEl($('#cats .cat[aria-pressed=true]')||$('#cats button'));
    if(t&&($('#list').contains(t)||$('#cats').contains(t)||t===$('#q')))return focusEl($('.tab[aria-pressed=true]'));
  }
  return false;
};
document.addEventListener('keydown',e=>{
  const t=document.activeElement,typing=t&&t.tagName==='INPUT'&&/^(text|search|url|password)$/.test(t.type);
  const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
  if(dir){
    /* Nei campi di testo e sul video le frecce destra/sinistra restano al campo (cursore) e al video (avanti/indietro) */
    if((typing||(t&&t.tagName==='VIDEO'))&&(dir==='left'||dir==='right'))return;
    e.preventDefault();moveFocus(dir);return;
  }
  if(e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack'||(e.key==='Backspace'&&!typing)){if(battvBack())e.preventDefault()}
});

/* ---------- App Android TV: ponte e player nativi ---------- */
/* Nell'app: vista TV (telecomando, vista compatta) solo sul televisore; sul telefono resta quella touch */
const TV=NATIVE&&(!BatTVNative.isTv||BatTVNative.isTv());
if(NATIVE){
  document.body.classList.add('native');
  if(TV)document.body.classList.add('tv');
  /* Il player nativo segnala un errore: se il provider ha cambiato server riprovo da quello nuovo */
  /* pos e dur arrivano dal player nativo in millisecondi (dur negativa se è una diretta) */
  const nativeSave=(pos,dur)=>{const m=S.playing&&S.playing.meta;if(m&&dur>0&&pos>0)saveProg(m,pos/1000,dur/1000)};
  window.battvNativeError=async(pos,dur)=>{
    const lp=S.lastPlay;if(!lp)return;
    nativeSave(pos,dur);
    const old=S.base;
    if(!lp.retried&&S.mode==='x'&&S.dns&&lp.raw.startsWith(old+'/')){
      BatTVNative.toast('Cerco il server aggiornato…');
      if(await refreshBase())return play(lp.title,S.base+lp.raw.slice(old.length),true,null,(pos||0)/1000);
    }
    BatTVNative.toast('Impossibile riprodurre questo contenuto.');
    if(!afterPlay())backTo(S.lastFocus);
  };
  window.battvNativeClosed=(pos,dur)=>{
    const m=S.playing&&S.playing.meta;
    nativeSave(pos,dur);if(!afterPlay())backTo(S.lastFocus);
    /* Finito davvero (non chiuso a metà): propone il prossimo episodio */
    if(m&&m.next&&dur>0&&pos>=dur-1500){const n=m.next();if(n)showNextUp(n,()=>{if(S.seriesView)S.seriesView.redraw()})}
  };
}

/* Accesso automatico se salvato */
const saved=store.get('xt');
if(saved){$('#srv').value=saved.base||'';$('#usr').value=saved.u;$('#pwd').value=saved.p;$('#px').value=saved.px||'';$('#dns').value=saved.dns||'';
  loginXtream(saved.base,saved.u,saved.p,saved.px,saved.dns,saved.home||saved.base).then(()=>{saveBase();enterApp()}).catch(e=>{$('#lerr').textContent=e.message;focusEl($('#go'))});
}else if(TV)focusEl($('#srv'));
</script>
